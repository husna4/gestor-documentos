<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragmentos/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <th:block th:replace="~{fragmentos/layout :: mensajes}"></th:block>

    <h1 class="h4 mb-3"><i class="bi bi-collection"></i> Secciones</h1>
    <div class="row g-3 mb-4">
        <div th:each="s : ${secciones}" class="col-6 col-md-4 col-lg-3">
            <a th:href="@{/secciones/{id}(id=${s.id})}" class="card tarjeta-acceso h-100 text-decoration-none">
                <div class="card-body d-flex flex-column justify-content-center">
                    <span class="fw-semibold fs-5" th:text="${s.nombre}">Sección</span>
                    <span class="small text-body-secondary"
                          th:with="n=${documentosPorSeccion.getOrDefault(s.id, 0L)}"
                          th:text="${n == 1 ? '1 documento' : n + ' documentos'}">0 documentos</span>
                </div>
            </a>
        </div>
        <div th:if="${sinClasificar > 0}" class="col-6 col-md-4 col-lg-3">
            <a th:href="@{/sin-clasificar}" class="card tarjeta-acceso h-100 text-decoration-none border-warning">
                <div class="card-body d-flex flex-column justify-content-center">
                    <span class="fw-semibold fs-5">Sin clasificar</span>
                    <span class="small text-body-secondary"
                          th:text="${sinClasificar == 1 ? '1 documento' : sinClasificar + ' documentos'}">0</span>
                </div>
            </a>
        </div>
        <div th:if="${#lists.isEmpty(secciones)}" class="col-12 text-body-secondary">
            Todavía no hay secciones.
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/secciones/nueva}">Crea la primera</a>.
        </div>
    </div>

    <h2 class="h4 mb-3"><i class="bi bi-people"></i> Personas</h2>
    <div class="row g-3 mb-4">
        <div th:each="p : ${personas}" class="col-6 col-md-4 col-lg-3">
            <a th:href="@{/personas/{id}(id=${p.id})}" class="card tarjeta-acceso h-100 text-decoration-none">
                <div class="card-body d-flex align-items-center gap-2">
                    <i class="bi bi-person-circle fs-2 text-primary"></i>
                    <span class="fw-semibold" th:text="${p.nombreCompleto()}">Persona</span>
                </div>
            </a>
        </div>
        <div th:if="${#lists.isEmpty(personas)}" class="col-12 text-body-secondary">
            Todavía no hay personas.
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/personas/nueva}">Añade la primera</a>.
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 mb-0"><i class="bi bi-clock-history"></i> Subidos recientemente</h2>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/documentos/subir}" class="btn btn-primary">
            <i class="bi bi-cloud-upload"></i> Subir
        </a>
    </div>
    <div th:replace="~{fragmentos/documentos :: lista(${recientes})}"></div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
