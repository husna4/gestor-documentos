<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(#{cuenta.cambiar})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <h1 class="h3 mb-3" th:text="#{cuenta.cambiar}">Cambiar contraseña</h1>

            <div th:if="${obligatorio}" class="alert alert-warning">
                <th:block th:text="#{cuenta.obligatoria}">Antes de continuar tienes que elegir una contraseña nueva.</th:block>
            </div>

            <form th:action="@{/cuenta/password}" th:object="${form}" method="post" class="card card-body shadow-sm">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${@mensajes.texto(error)}" class="mb-0">Error</p>
                </div>

                <div class="mb-3">
                    <label for="actual" class="form-label" th:text="#{cuenta.actual}">Contraseña actual</label>
                    <input type="password" th:field="*{actual}" class="form-control"
                           th:errorclass="is-invalid" autocomplete="current-password" required>
                    <div class="invalid-feedback" th:errors="*{actual}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="nueva" class="form-label" th:text="#{cuenta.nueva}">Nueva contraseña</label>
                    <input type="password" th:field="*{nueva}" class="form-control"
                           th:errorclass="is-invalid" autocomplete="new-password" required>
                    <div class="form-text" th:text="#{cuenta.minimo}">Mínimo 8 caracteres.</div>
                    <div class="invalid-feedback" th:errors="*{nueva}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="repetida" class="form-label" th:text="#{cuenta.repetir}">Repite la nueva contraseña</label>
                    <input type="password" th:field="*{repetida}" class="form-control"
                           th:errorclass="is-invalid" autocomplete="new-password" required>
                    <div class="invalid-feedback" th:errors="*{repetida}">Error</div>
                </div>
                <button type="submit" class="btn btn-primary w-100" th:text="#{cuenta.guardar}">Guardar contraseña</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
