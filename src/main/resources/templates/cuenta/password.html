<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Cambiar contraseña')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <h1 class="h3 mb-3">Cambiar contraseña</h1>

            <div th:if="${obligatorio}" class="alert alert-warning">
                Antes de continuar tienes que elegir una contraseña nueva.
            </div>

            <form th:action="@{/cuenta/password}" th:object="${form}" method="post" class="card card-body shadow-sm">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${error}" class="mb-0">Error</p>
                </div>

                <div class="mb-3">
                    <label for="actual" class="form-label">Contraseña actual</label>
                    <input type="password" th:field="*{actual}" class="form-control"
                           th:errorclass="is-invalid" autocomplete="current-password" required>
                    <div class="invalid-feedback" th:errors="*{actual}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="nueva" class="form-label">Nueva contraseña</label>
                    <input type="password" th:field="*{nueva}" class="form-control"
                           th:errorclass="is-invalid" autocomplete="new-password" required>
                    <div class="form-text">Mínimo 8 caracteres.</div>
                    <div class="invalid-feedback" th:errors="*{nueva}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="repetida" class="form-label">Repite la nueva contraseña</label>
                    <input type="password" th:field="*{repetida}" class="form-control"
                           th:errorclass="is-invalid" autocomplete="new-password" required>
                    <div class="invalid-feedback" th:errors="*{repetida}">Error</div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
