<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(#{busqueda.titulo})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <h1 class="h3 mb-3" th:text="#{busqueda.documentos}">Buscar documentos</h1>
    <!--
      Sin JavaScript es un formulario normal. Con htmx, a los 300 ms de dejar de escribir
      pide /buscar?q=... y sustituye solo #resultados (búsqueda en vivo).
    -->
    <form th:action="@{/buscar}" method="get" role="search" class="mb-3">
        <div class="input-group input-group-lg">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" name="q" th:value="${q}" class="form-control" th:placeholder="#{busqueda.nombrePlaceholder}"
                   th:aria-label="#{busqueda.nombre}" autofocus autocomplete="off"
                   th:attr="hx-get=@{/buscar}" hx-trigger="input changed delay:300ms, search"
                   hx-target="#resultados" hx-swap="outerHTML" hx-replace-url="true" hx-indicator="#buscando">
        </div>
        <div class="form-text"><th:block th:text="#{busqueda.ayuda}">No distingue mayúsculas ni tildes: «maria» encuentra «María».</th:block>
            <span id="buscando" class="htmx-indicator spinner-border spinner-border-sm ms-1" role="status"></span>
        </div>
    </form>

    <div id="resultados" th:fragment="resultados">
        <th:block th:if="${#strings.isEmpty(#strings.trim(q))}">
            <p class="text-body-secondary" th:text="#{busqueda.escribir}">Escribe para buscar.</p>
        </th:block>
        <th:block th:unless="${#strings.isEmpty(#strings.trim(q))}">
            <p class="text-body-secondary"
               th:text="#{busqueda.resultados(${#lists.size(documentos)})}">0</p>
            <div th:replace="~{fragmentos/documentos :: lista(${documentos})}"></div>
        </th:block>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
