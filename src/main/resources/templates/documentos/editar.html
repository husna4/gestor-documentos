<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Editar documento')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <nav aria-label="Ruta"><ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                <li class="breadcrumb-item"><a th:href="@{/documentos/{id}(id=${documento.id})}"
                                               th:text="${documento.nombreVisible}">Documento</a></li>
                <li class="breadcrumb-item active" aria-current="page">Editar</li>
            </ol></nav>
            <h1 class="h3 mb-3">Editar documento</h1>

            <form th:action="@{/documentos/{id}/editar(id=${documento.id})}" th:object="${form}" method="post"
                  class="card card-body shadow-sm">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${error}" class="mb-0">Error</p>
                </div>
                <div class="mb-3">
                    <label for="nombreVisible" class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombreVisible}" class="form-control" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{nombreVisible}">Error</div>
                    <div class="form-text">Fichero original: <span th:text="${documento.nombreOriginal}">x</span></div>
                </div>

                <th:block th:replace="~{fragmentos/documentos :: campos-clasificacion}"></th:block>

                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/documentos/{id}(id=${documento.id})}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
