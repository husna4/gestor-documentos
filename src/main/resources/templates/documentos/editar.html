<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(#{documentos.editar})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <nav th:aria-label="#{comun.ruta}"><ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}" th:text="#{comun.inicio}">Inicio</a></li>
                <li class="breadcrumb-item"><a th:href="@{/documentos/{id}(id=${documento.id})}"
                                               th:text="${documento.nombreVisible}">Documento</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="#{comun.editar}">Editar</li>
            </ol></nav>
            <h1 class="h3 mb-3" th:text="#{documentos.editar}">Editar documento</h1>

            <form th:action="@{/documentos/{id}/editar(id=${documento.id})}" th:object="${form}" method="post"
                  class="card card-body shadow-sm">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${@mensajes.texto(error)}" class="mb-0">Error</p>
                </div>
                <div class="mb-3">
                    <label for="nombreVisible" class="form-label" th:text="#{comun.nombre}">Nombre</label>
                    <input type="text" th:field="*{nombreVisible}" class="form-control" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{nombreVisible}">Error</div>
                    <div class="form-text"><th:block th:text="#{documentos.originalEtiqueta}">Fichero original:</th:block> <span th:text="${documento.nombreOriginal}">x</span></div>
                </div>

                <th:block th:replace="~{fragmentos/documentos :: campos-clasificacion}"></th:block>

                <div class="mb-3">
                    <label for="descripcion" class="form-label" th:text="#{comun.descripcion}">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{comun.guardar}">Guardar</button>
                    <a th:href="@{/documentos/{id}(id=${documento.id})}" class="btn btn-outline-secondary" th:text="#{comun.cancelar}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
