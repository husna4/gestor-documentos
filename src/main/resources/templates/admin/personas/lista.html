<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(#{personas.titulo})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <th:block th:replace="~{fragmentos/layout :: mensajes}"></th:block>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="#{personas.titulo}">Personas</h1>
        <a th:href="@{/admin/personas/nueva}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <th:block th:text="#{personas.nueva}">Nueva persona</th:block></a>
    </div>
    <p th:if="${#lists.isEmpty(personas)}" class="text-body-secondary" th:text="#{personas.vacias}">Todavía no hay personas.</p>
    <div class="list-group shadow-sm" th:unless="${#lists.isEmpty(personas)}">
        <div th:each="p : ${personas}" class="list-group-item d-flex flex-wrap gap-2 align-items-center">
            <a th:href="@{/personas/{id}(id=${p.id})}" class="flex-grow-1 fw-semibold text-decoration-none"
               th:text="${p.nombreCompleto()}">Persona</a>
            <a th:href="@{/admin/personas/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil"></i> <th:block th:text="#{comun.editar}">Editar</th:block></a>
            <a th:href="@{/admin/personas/{id}/borrar(id=${p.id})}" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash"></i> <th:block th:text="#{comun.borrar}">Borrar</th:block></a>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
