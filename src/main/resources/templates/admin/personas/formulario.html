<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${id == null ? 'Nueva persona' : 'Editar persona'})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="h3 mb-3" th:text="${id} == null ? 'Nueva persona' : 'Editar persona'">Persona</h1>
            <form th:action="${id} == null ? @{/admin/personas/nueva} : @{/admin/personas/{id}/editar(id=${id})}"
                  th:object="${form}" method="post" class="card card-body shadow-sm">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid" required autofocus>
                    <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="apellidos" class="form-label">Apellidos <span class="text-body-secondary">(opcional)</span></label>
                    <input type="text" th:field="*{apellidos}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{apellidos}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="notas" class="form-label">Notas <span class="text-body-secondary">(opcional)</span></label>
                    <textarea th:field="*{notas}" class="form-control" rows="3" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{notas}">Error</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/admin/personas}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
