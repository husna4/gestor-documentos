<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head('Secciones')}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <th:block th:replace="~{fragmentos/layout :: mensajes}"></th:block>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Secciones</h1>
        <a th:href="@{/admin/secciones/nueva}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva sección</a>
    </div>
    <p th:if="${#lists.isEmpty(secciones)}" class="text-body-secondary">Todavía no hay secciones.</p>
    <div class="list-group shadow-sm" th:unless="${#lists.isEmpty(secciones)}">
        <div th:each="s : ${secciones}" class="list-group-item d-flex flex-wrap gap-2 align-items-center">
            <div class="flex-grow-1">
                <a th:href="@{/secciones/{id}(id=${s.id})}" class="fw-semibold text-decoration-none" th:text="${s.nombre}">Sección</a>
                <div th:if="${s.descripcion}" class="small text-body-secondary" th:text="${s.descripcion}">Descripción</div>
            </div>
            <a th:href="@{/admin/secciones/{id}/editar(id=${s.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil"></i> Editar</a>
            <a th:href="@{/admin/secciones/{id}/borrar(id=${s.id})}" class="btn btn-sm btn-outline-danger">
                <i class="bi bi-trash"></i> Borrar</a>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
