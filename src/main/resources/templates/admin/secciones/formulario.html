<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(${id == null ? 'Nueva sección' : 'Editar sección'})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="h3 mb-3" th:text="${id} == null ? 'Nueva sección' : 'Editar sección'">Sección</h1>
            <form th:action="${id} == null ? @{/admin/secciones/nueva} : @{/admin/secciones/{id}/editar(id=${id})}"
                  th:object="${form}" method="post" class="card card-body shadow-sm">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid"
                           placeholder="Por ejemplo: DNI, Casa, Ayuda alquiler" required autofocus>
                    <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="descripcion" class="form-label">Descripción <span class="text-body-secondary">(opcional)</span></label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="2" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/admin/secciones}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
