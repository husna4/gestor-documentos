<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(#{usuarios.titulo})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <th:block th:replace="~{fragmentos/layout :: mensajes}"></th:block>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="#{usuarios.titulo}">Usuarios</h1>
        <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> <th:block th:text="#{usuarios.nuevo}">Nuevo usuario</th:block></a>
    </div>
    <div class="list-group shadow-sm">
        <div th:each="u : ${usuarios}" class="list-group-item d-flex flex-wrap gap-2 align-items-center">
            <div class="flex-grow-1">
                <span class="fw-semibold" th:text="${u.username}">usuario</span>
                <span th:if="${u.id == idActual}" class="badge text-bg-secondary" th:text="#{usuarios.tu}">tú</span>
                <span class="badge" th:classappend="${u.rol.name() == 'ADMIN'} ? 'text-bg-primary' : 'text-bg-light border'"
                      th:text="${u.rol.name() == 'ADMIN'} ? #{usuarios.rolAdmin} : #{usuarios.rolUsuario}">Rol</span>
                <span th:unless="${u.activo}" class="badge text-bg-danger" th:text="#{usuarios.desactivado}">Desactivado</span>
                <span th:if="${u.debeCambiarPassword}" class="badge text-bg-warning" th:text="#{usuarios.debeCambiar}">Debe cambiar contraseña</span>
                <div th:if="${u.personaId != null and personas[u.personaId] != null}" class="small text-body-secondary">
                    <i class="bi bi-person"></i> <span th:text="${personas[u.personaId].nombreCompleto()}">Persona</span>
                </div>
            </div>
            <a th:href="@{/admin/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-pencil"></i> <th:block th:text="#{comun.editar}">Editar</th:block></a>
            <form th:unless="${u.id == idActual}" th:action="@{/admin/usuarios/{id}/borrar(id=${u.id})}" method="post"
                  th:data-confirmar="#{usuarios.confirmarBorrado(${u.username})}">
                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> <th:block th:text="#{comun.borrar}">Borrar</th:block></button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
