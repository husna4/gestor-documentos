<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/layout :: head(#{usuarios.nuevo})}"></head>
<body>
<nav th:replace="~{fragmentos/layout :: navbar}"></nav>
<main class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <h1 class="h3 mb-3" th:text="#{usuarios.nuevo}">Nuevo usuario</h1>
            <form th:action="@{/admin/usuarios/nuevo}" th:object="${form}" method="post" class="card card-body shadow-sm">
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="error : ${#fields.globalErrors()}" th:text="${@mensajes.texto(error)}" class="mb-0">Error</p>
                </div>
                <div class="mb-3">
                    <label for="username" class="form-label" th:text="#{usuarios.usuario}">Usuario</label>
                    <input type="text" th:field="*{username}" class="form-control" th:errorclass="is-invalid"
                           autocapitalize="none" autocomplete="off" required autofocus>
                    <div class="invalid-feedback" th:errors="*{username}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{cuenta.temporal}">Contraseña temporal</label>
                    <input type="text" th:field="*{password}" class="form-control" th:errorclass="is-invalid"
                           autocomplete="off" required>
                    <div class="form-text" th:text="#{cuenta.temporalNueva}">Díselo a la persona: tendrá que cambiarla la primera vez que entre.</div>
                    <div class="invalid-feedback" th:errors="*{password}">Error</div>
                </div>
                <div class="mb-3">
                    <label for="idioma" class="form-label" th:text="#{comun.idioma}">Idioma</label>
                    <select th:field="*{idioma}" class="form-select" th:errorclass="is-invalid">
                        <option value="es" lang="es">Español</option>
                        <option value="en" lang="en">English</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{idioma}"></div>
                </div>
                <div class="mb-3">
                    <label for="rol" class="form-label" th:text="#{usuarios.rol}">Rol</label>
                    <select th:field="*{rol}" class="form-select" th:errorclass="is-invalid">
                        <option value="USER" th:text="#{usuarios.rolUsuarioAyuda}">Usuario: solo ver y descargar</option>
                        <option value="ADMIN" th:text="#{usuarios.rolAdminAyuda}">Administrador: además subir, editar, borrar y gestionar</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{rol}"></div>
                </div>
                <div class="mb-3">
                    <label for="personaId" class="form-label"><th:block th:text="#{personas.familia}">Persona de la familia</th:block> <span class="text-body-secondary" th:text="#{comun.opcional}">(opcional)</span></label>
                    <select th:field="*{personaId}" class="form-select">
                        <option value="" th:text="#{usuarios.ningunaPersona}">— Ninguna —</option>
                        <option th:each="p : ${personas}" th:value="${p.id}" th:text="${p.nombreCompleto()}">Persona</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{usuarios.crear}">Crear usuario</button>
                    <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary" th:text="#{comun.cancelar}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragmentos/layout :: scripts}"></th:block>
</body>
</html>
